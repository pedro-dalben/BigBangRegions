plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		url "https://artefacts.cobblemon.com/releases/"
		content {
			includeGroup "com.cobblemon"
		}
	}
}

def bigmoncraftApiJar = file(providers.gradleProperty('bigmoncraft_api_jar').orElse(
	"../BigMonCraft/build/libs/bigmoncraft-${project.bigmoncraft_api_version}.jar").get())
if (!bigmoncraftApiJar.isFile()) {
	throw new GradleException("Missing pinned BigMonCraft API JAR: ${bigmoncraftApiJar}. Build BigMonCraft first or pass -Pbigmoncraft_api_jar=<exact-api-jar>.")
}

loom {
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "bigbangregions.refmap.json"
	}

	mods {
		"bigbangregions" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Fabric Permissions API
	modImplementation "me.lucko:fabric-permissions-api:0.3.1"
	include "me.lucko:fabric-permissions-api:0.3.1"

	// Optional public API only. BigMonCraft remains absent at runtime without disabling regions.
	modCompileOnly files(bigmoncraftApiJar)
	testRuntimeOnly files(bigmoncraftApiJar)

	// Cobblemon supplies this API at runtime; do not bundle it into BigBang Regions.
	modCompileOnly "com.cobblemon:fabric:${project.cobblemon_version}"
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"

	// BigBang Essentials public API only. The exact artifact is intentionally pinned.
	def essentialsApiJar = file(providers.gradleProperty('bigbangessentials_api_jar').orElse(
		"../BigBangEssentials/common/build/libs/bigbangessentials-common-${project.bigbangessentials_api_version}.jar").get())
	if (!essentialsApiJar.isFile()) {
		throw new GradleException("Missing pinned BigBangEssentials API JAR: ${essentialsApiJar}. Build Essentials common first or pass -Pbigbangessentials_api_jar=<exact-api-jar>.")
	}
	compileOnly files(essentialsApiJar)

	tasks.register('verifyBigBangEssentialsApiJar') {
		doLast {
			def classes = zipTree(essentialsApiJar).matching { include 'com/pedrodalben/bigbangessentials/api/gems/**' }
			if (classes.isEmpty()) throw new GradleException("Pinned BigBangEssentials API JAR has no public Gems integration API: ${essentialsApiJar}")
		}
	}

	// SQLite JDBC
	implementation "org.xerial:sqlite-jdbc:3.46.0.0"
	include "org.xerial:sqlite-jdbc:3.46.0.0"

	// Testing dependencies
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testImplementation 'org.mockito:mockito-core:5.11.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named('compileJava') { dependsOn 'verifyBigBangEssentialsApiJar' }

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
